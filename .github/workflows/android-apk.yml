name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, design/mint-interface]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkGrab-android-arm64-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  ui-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build emulator APKs
        run: gradle --no-daemon -PtestAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify native UI on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.android.launcher3
            adb shell am instrument -w com.example.linkgrab.test/com.example.linkgrab.UiSmokeInstrumentation | tee ui-smoke.log
            adb logcat -d -v brief AndroidRuntime:E '*:S' | tee crash.log
            adb pull /sdcard/Android/data/com.example.linkgrab/files/screenshots screenshots || true
            grep -q UI_SMOKE_OK ui-smoke.log
      - name: Collect screenshots
        if: always()
        run: adb pull /sdcard/Android/data/com.example.linkgrab/files/screenshots screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LinkGrab-UI-screenshots
          path: |
            screenshots/
            ui-smoke.log
            crash.log
