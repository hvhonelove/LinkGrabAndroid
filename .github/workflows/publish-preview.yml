name: Publish LinkGrab preview

on:
  workflow_run:
    workflows: ["Build and verify LinkGrab"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Build and verify LinkGrab run ID (optional)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-linkgrab-preview
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Find verified APK for current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${MANUAL_RUN_ID:-${TRIGGER_RUN_ID:-}}"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID=$(gh run list --workflow android-apk.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          CONCLUSION=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.conclusion')
          EVENT=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.event')
          BRANCH=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.head_branch')
          SHA=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.head_sha')
          test "$CONCLUSION" = success
          test "$EVENT" = push
          test "$BRANCH" = main
          test "$SHA" = "$(git rev-parse HEAD)"
          ARTIFACT_ID=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "LinkGrab-2-android-arm64-apk" and .expired == false) | .id' | head -1)
          test -n "$ARTIFACT_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "VERIFIED_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Download exact verified APK
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RUN_ID }}
          artifact-ids: ${{ env.ARTIFACT_ID }}
          merge-multiple: true
          path: dist
      - name: Publish preview APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          TAG="v${VERSION}-preview"
          APK="LinkGrab-${VERSION}-preview.apk"
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          mv dist/app-debug.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          ## LinkGrab — бесплатный видеозагрузчик для Android

          **Видео и аудио по ссылке. Без рекламы, подписок и регистрации.**

          - YouTube, X/Twitter, TikTok и VK Видео (когда ссылки доступны yt-dlp).
          - Приоритет TikTok-потокам без водяного знака, если источник их предоставляет.
          - Предпросмотр, выбор качества, фоновая очередь, прогресс и история.
          - Сохранение через Android MediaStore, тёмная и светлая темы.
          - Автоматическая проверка обновлений yt-dlp при первом использовании.

          ### Как установить
          1. Скачай APK в разделе **Assets** ниже.
          2. Открой APK через «Мои файлы → Загрузки» и подтверди установку.
          3. Вставь ссылку и скачай видео.

          **Android 10+, ARM64.**

          ### Важно
          Это **preview-сборка с временной debug-подписью**, не стабильный release с постоянным сертификатом. При переходе между сборками может понадобиться удалить старую установку — при удалении сбросятся история и настройки LinkGrab. Видео в общей медиатеке обычно сохраняются.

          Сайты могут ограничивать загрузку; DRM, закрытые аккаунты и требующая авторизации медиатека не поддерживаются. Скачивай только контент, который разрешено сохранять.

          Исходники: GNU GPL-3.0-only. См. README, PRIVACY и THIRD_PARTY_NOTICES.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite APK."
            exit 0
          fi
          gh release create "$TAG" "dist/$APK" dist/SHA256SUMS.txt \
            --target "$VERIFIED_SHA" \
            --title "LinkGrab $VERSION — Android Preview" \
            --prerelease --notes-file dist/RELEASE_NOTES.md
